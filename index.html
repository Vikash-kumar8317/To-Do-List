<body>
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List ✅</h1>

        <p class="subtitle">
            Organize your daily tasks
        </p>

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>

        <div class="task-info">

            <span>
                Total: <strong id="totalTasks">0</strong>
            </span>

            <span>
                Completed: <strong id="completedTasks">0</strong>
            </span>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
